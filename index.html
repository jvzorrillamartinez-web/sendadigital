<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SendaDigital | Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d32f2f">
</head>
<body>
    <header>
        <h1 id="main-title">SendaDigital</h1>
        <div id="counter-box">
            <span id="days">0</span> días de Mente Clara
        </div>
    </header>

    <main>
        <section class="emergency-section">
            <button onclick="showTipp('water')" class="btn-tipp">❄️ AGUA FRÍA (Shock)</button>
            <button onclick="showTipp('muscle')" class="btn-tipp">💪 TENSIÓN/RELAX</button>
        </section>

        <section class="check-in">
            <h2>Nivel de Impulso (0-10)</h2>
            <input type="range" id="craving-slider" min="0" max="10" value="0">
            <button onclick="saveLog()" class="btn-save">Registrar Ahora</button>
        </section>

        <footer>
            <button onclick="exportData()" class="btn-export">Exportar mis datos (.json)</button>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
