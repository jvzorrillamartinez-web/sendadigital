<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SendaDigital | Empoderamiento</title>
    <link rel="stylesheet" href="style.css?v=1.1">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header>
        <div class="brand">SendaDigital</div>
        <div id="evolution-panel">
            <h2 id="days-count">0 Días</h2>
            <p id="bio-progress">Tu sistema nervioso se está estabilizando...</p>
        </div>
    </header>

    <main>
        <section class="card emergency">
            <h3>🚨 Crisis TIPP (Acción Inmediata)</h3>
            <div class="tipp-grid">
                <button onclick="tipp('hielo')">❄️ Choque Térmico</button>
                <button onclick="tipp('respiracion')">💨 Respiración 4-7-8</button>
            </div>
        </section>

        <section class="card wise-mind">
            <h3>🧠 Diario de Mente Sabia</h3>
            <textarea id="emotion-input" placeholder="¿Qué dice mi emoción?"></textarea>
            <textarea id="logic-input" placeholder="¿Qué dice mi lógica?"></textarea>
            <button onclick="saveWiseMind()" class="btn-primary">Equilibrar</button>
        </section>

        <section class="card regulation">
            <h3>🌊 Surf de Urgencia</h3>
            <p>Etiqueta tu emoción para actuar:</p>
            <select id="emotion-tag" onchange="suggestAction()">
                <option value="">Selecciona...</option>
                <option value="rabia">Rabia / Ira</option>
                <option value="tristeza">Tristeza Profunda</option>
                <option value="ansiedad">Ansiedad / Urgencia</option>
            </select>
            <div id="action-suggestion" class="suggestion-box"></div>
        </section>
    </main>

    <footer>
        <button onclick="exportData()" class="btn-subtle">Exportar Historial Clínico (.json)</button>
    </footer>

    <script src="app.js"></script>
</body>
</html>
